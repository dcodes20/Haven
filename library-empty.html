<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haven Library Empty</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0,1&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="library-empty.css">
<link rel="stylesheet" href="effects.css">
</head>
<body>

<div class="app" id="app">
  <aside class="side" aria-label="Haven">
    <div class="brand"><img src="assets/icon.webp" alt="" width="24" height="24"><span>Haven</span></div>
    <nav aria-label="Main">
      <a class="nav" href="home-empty.html" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</a>
      <button class="nav" type="button" data-tab="library" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>Library</button>
      <button class="nav" type="button" data-tab="album"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg>Album</button>
      <button class="nav" type="button" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</button>
    </nav>
    <button class="cta" type="button" data-add><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add memories</button>
    <p class="foot">Original quality, always. Only you can see what&rsquo;s here.</p>
  </aside>

  <div class="main">
    <header class="top" id="top">
      <div class="top-in pad">
        <h1 class="title">Library</h1>
        <div class="acts">
          <button class="ic" type="button" id="searchBtn" aria-label="Search" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
          <button class="ic" type="button" id="menuBtn" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
          <div class="menu" id="menu" role="menu">
            <button type="button" role="menuitem" id="mSelect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>Select</button>
            <button type="button" role="menuitem" id="mSort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg><span id="sortT">Oldest first</span></button>
            <button type="button" role="menuitem" data-add><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add memories</button>
          </div>
        </div>
      </div>
      <div class="pad bar2">
        <div class="searchrow" id="searchRow"><div><label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Search your memories" autocomplete="off" aria-label="Search your memories"><button type="button" id="qx">Close</button></label></div></div>
        <div class="filters" role="group" aria-label="Filter">
          <button class="chip" type="button" data-f="all" aria-pressed="true">All</button>
          <button class="chip" type="button" data-f="photo" aria-pressed="false">Photos</button>
          <button class="chip" type="button" data-f="video" aria-pressed="false">Videos</button>
        </div>
      </div>
    </header>

    <main class="lib pad">
      <section class="blank" id="blank" aria-label="Your library is empty">
        <div class="art" data-tilt="6">
          <img class="illustration" src="assets/Woman Exploring a Memory Archive.png" alt="Woman exploring a memory archive">
          <span class="badge">Safe in Haven</span>
        </div>
        <div class="msg"><h2>Your library is empty</h2><p>Upload your first photos and videos. They&rsquo;ll live here safely.</p></div>
        <button class="upload" type="button" data-add data-magnetic><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Upload media</button>
      </section>
      <div class="grid" id="grid" role="list" hidden></div>
      <div class="empty" id="empty" hidden><b>Nothing found</b><span id="emptyS">Try another word or filter.</span></div>
    </main>
  </div>

  <nav class="tabs" aria-label="Main">
    <div class="tabs-in">
      <a class="tab" href="home-empty.html" data-tab="home"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Home</a>
      <button class="tab" type="button" data-tab="library" aria-current="page"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></span>Library</button>
      <button class="add" type="button" data-add aria-label="Add memories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      <button class="tab" type="button" data-tab="album"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg></span>Album</button>
      <button class="tab" type="button" data-tab="profile"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>Profile</button>
    </div>
  </nav>

  <div class="selbar" id="selbar" aria-hidden="true"><div class="selbar-in pad"><b id="selN">0 selected</b><button class="pillbtn" type="button" id="selCancel">Cancel</button><button class="pillbtn go" type="button" id="selDel" disabled>Delete</button></div></div>
</div>

<input class="pick" id="pick" type="file" accept="image/*,video/*" multiple tabindex="-1" aria-hidden="true">
<dialog class="viewer" id="viewer"><button class="x" type="button" id="viewerX" aria-label="Close">&times;</button><button class="nav2 p" type="button" id="vPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button class="nav2 n" type="button" id="vNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><figure><div class="media" id="viewerMedia"></div><figcaption id="viewerCap"></figcaption></figure></dialog>
<div class="drop" id="drop" aria-hidden="true"><b>Drop to save in Haven</b><span>Photos and videos</span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="effects.js"></script>
<script src="media-store.js"></script>
<script src="library-empty.js"></script>
</body>
</html>
