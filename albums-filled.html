<input class="pick" id="pick" type="file" accept="image/*,video/*" multiple tabindex="-1" aria-hidden="true">
<dialog class="sheet" id="sheet" aria-labelledby="sheetT">
  <form id="form" novalidate>
    <h2 id="sheetT">New album</h2>
    <label class="lab" for="nm">Album name</label>
    <input class="txt" id="nm" name="nm" type="text" maxlength="40" autocomplete="off" placeholder="Summer in Lagos">
    <p class="err" id="err" role="alert" hidden>Give your album a name.</p>
    <div id="memRow" class="memrow"><button class="pillbtn" type="button" id="addMem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add memories</button><span class="memsum" id="memSum">None yet. You can add them later.</span></div>
    <div class="sheet-btns"><button class="pillbtn" type="button" id="cancel">Cancel</button><button class="pillbtn go" type="submit" id="go">Create album</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
