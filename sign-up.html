<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haven Sign Up</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0,1&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="sign-up.css">
<link rel="stylesheet" href="effects.css">
</head>

<body>
<div class="page">
  <header class="head">
    <a class="brand" href="#" aria-label="Haven"><img src="assets/icon.webp" alt="" width="24" height="24"><span>Haven</span></a>
  </header>

  <div class="intro" id="intro">
    <h1>Create your Haven</h1>
    <p>Your memories will stay safe here.</p>
  </div>

  <form class="signup" id="signup" novalidate>
    <button class="google" type="button" id="google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="or" role="separator" aria-label="or"><span>OR</span></div>

    <div class="fields">
      <div class="field" data-field="name">
        <label for="name">Display Name</label>
        <div class="box"><input id="name" name="name" type="text" placeholder="What should we call you?" autocomplete="nickname" maxlength="60" aria-describedby="name-msg"></div>
        <p class="msg" id="name-msg" aria-live="polite"></p>
      </div>
      <div class="field" data-field="email">
        <label for="email">Email</label>
        <div class="box"><input id="email" name="email" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email" aria-describedby="email-msg"></div>
        <p class="msg" id="email-msg" aria-live="polite"></p>
      </div>
      <div class="field" data-field="password">
        <label for="password">Password</label>
        <div class="box has-toggle">
          <input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" aria-describedby="password-msg">
          <button class="reveal" type="button" data-for="password" aria-label="Show password" aria-pressed="false">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
        <div class="meter" id="meter" data-s="0" hidden aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <p class="hint" id="strength" aria-live="polite"></p>
        <p class="msg" id="password-msg" aria-live="polite"></p>
      </div>
      <div class="field" data-field="confirm">
        <label for="confirm">Confirm Password</label>
        <div class="box has-toggle is-disabled" id="confirm-box">
          <input id="confirm" name="confirm" type="password" placeholder="At least 8 characters" autocomplete="new-password" disabled aria-describedby="confirm-msg">
          <button class="reveal" type="button" data-for="confirm" aria-label="Show confirm password" aria-pressed="false">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
        <p class="msg" id="confirm-msg" aria-live="polite"></p>
      </div>
    </div>

    <div class="actions">
      <button class="create" type="submit" id="create"><span class="spin" id="spin" hidden></span><span id="createLabel">Create account</span></button>
      <a class="signin" href="log-in.html" id="signin">Already have an account? <b>Log in</b>
        <svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5c.5 5.6 4.9 10 10.5 10.5-5.6.5-10 4.9-10.5 10.5C11.5 16.9 7.1 12.5 1.5 12 7.1 11.5 11.5 7.1 12 1.5z"/></svg>
      </a>
    </div>

    <div class="terms" id="terms">
      <label class="agree">
        <input type="checkbox" id="agree" aria-describedby="agree-msg">
        <span class="tickbox"><svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5"/></svg></span>
        <span>By continuing you agree to our <a href="#" data-soon="Terms aren't part of this design yet.">Terms</a> &amp; <a href="#" data-soon="The Privacy Policy isn't part of this design yet.">Privacy Policy</a></span>
      </label>
      <p class="msg" id="agree-msg" aria-live="polite"></p>
    </div>
  </form>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="effects.js"></script>
<script src="sign-up.js"></script>
</body>
</html>
