<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Haven Albums Empty</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0,1&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="albums-empty.css?v=3">
  <link rel="stylesheet" href="effects.css">
</head>
<body>

<div class="app" id="app">
  <aside class="side" aria-label="Haven">
    <div class="brand"><img src="assets/icon.webp" alt="" width="24" height="24"><span>Haven</span></div>
    <nav aria-label="Main">
      <a class="nav" href="./home-empty.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</a>
      <a class="nav" href="./library-empty.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>Library</a>
      <button class="nav" type="button" data-tab="album" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg>Album</button>
      <button class="nav" type="button" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</button>
    </nav>
    <button class="cta" type="button" data-add><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add memories</button>
    <p class="foot">Original quality, always. Only you can see what&rsquo;s here.</p>
  </aside>

  <div class="main">
    <header class="top" id="top">
      <div class="top-in pad">
        <h1 class="title">Albums</h1>
        <div class="acts"><button class="ic" type="button" id="newBtn" aria-label="Create album"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
      </div>
    </header>

    <main class="lib pad">
      <section class="blank" id="blank" aria-label="No albums yet">
        <div class="art" data-tilt="5">
          <img class="illustration" src="assets/Haven_s_Empty_Vault_Worry-removebg-preview.png" alt="An empty vault illustration">
        </div>
        <div class="msg"><h2>No albums yet</h2><p>Create an album to group your favourite memories.</p></div>
        <button class="upload" type="button" data-new data-magnetic><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Create album</button>
      </section>
      <div class="agrid" id="agrid" role="list" hidden></div>
    </main>
  </div>

  <nav class="tabs" aria-label="Main">
    <div class="tabs-in">
      <a class="tab" href="./home-empty.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Home</a>
      <a class="tab" href="./library-empty.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></span>Library</a>
      <button class="add" type="button" data-add aria-label="Add memories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      <button class="tab" type="button" data-tab="album" aria-current="page"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 22H4a2 2 0 0 1-2-2V6"/><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"/><circle cx="12" cy="8" r="2"/><rect width="16" height="16" x="6" y="2" rx="2"/></svg></span>Album</button>
      <button class="tab" type="button" data-tab="profile"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>Profile</button>
    </div>
  </nav>
</div>

<input class="pick" id="pick" type="file" accept="image/*,video/*" multiple tabindex="-1" aria-hidden="true">
<dialog class="sheet" id="sheet" aria-labelledby="sheetT">
  <form id="form" novalidate>
    <h2 id="sheetT">New album</h2>
    <label class="lab" for="nm">Album name</label>
    <input class="txt" id="nm" name="nm" type="text" maxlength="40" autocomplete="off" placeholder="Summer in Lagos">
    <p class="err" id="err" role="alert" hidden>Give your album a name.</p>
    <div id="memRow" class="memrow"><button class="pillbtn" type="button" id="addMem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add memories</button><span class="memsum" id="memSum">None yet. You can add them later.</span></div>
    <div class="sheet-btns"><button class="pillbtn" type="button" id="cancel">Cancel</button><button class="pillbtn go" type="submit" id="go">Create album</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="effects.js"></script>
<script src="albums-empty.js"></script>
</body>
</html>
