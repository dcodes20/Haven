<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haven First Memories</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0,1&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="first-memories.css">
<link rel="stylesheet" href="effects.css">
</head>

<body>
<div class="page">
  <header class="head">
    <a class="brand" href="#" aria-label="Haven"><img src="assets/icon.webp" alt="" width="24" height="24"><span>Haven</span></a>
  </header>

  <div class="bar">
    <div class="progress" role="img" aria-label="Step 1 of 3"><i class="on"></i><i></i><i></i></div>
    <button class="skip" type="button" id="skip">Skip</button>
  </div>

  <main class="content">
    <p class="eyebrow">Your first memories</p>
    <h1>Make yourself at home.</h1>
    <p class="lede">Start with a few photos or videos you love. You choose what comes into Haven.</p>

    <div class="fan" id="fan" data-tilt="9" role="group" aria-label="A few moments worth keeping">
      <button class="pol left" type="button" aria-pressed="false" data-title="The coast, just me">
        <span class="photo"><img src="./assets/The coast, just me photograph.png" alt=""></span><span class="cap">The coast, just me</span>
        <span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg></span>
      </button>
      <button class="pol mid" type="button" aria-pressed="false" data-title="Sunday, it’s dark outside">
        <span class="photo"><span class="ph night"></span><img src="./assets/dark outside.png" alt=""></span><span class="cap">Sunday, it’s dark outside</span>
        <span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg></span>
      </button>
      <button class="pol right" type="button" aria-pressed="false" data-title="The great outdoors">
        <span class="photo"><img src="./assets/The great outdoors photograph.png" alt=""></span><span class="cap">The great outdoors</span>
        <span class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg></span>
      </button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="private">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <div><b>Just for you. Unless you share.</b><span>No public feed. No automatic uploads.</span></div>
    </div>
  </main>

  <div class="next">
    <button class="btn" type="button" id="next">Next</button>
    <p class="fine">Original quality, always. Add more anytime.</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="effects.js"></script>
<script src="first-memories.js"></script>
</body>
</html>
